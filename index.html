<!doctype html>
<!-- The game shell: title screen, the loading screen between scenes, and one frame that holds the scene being played.
     Each scene is its own page (scene1.html, office.html, scene2.html, credits.html) loaded into #stage. Source: src/shell/ -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Art of the Mexican Revolution: Casasola's Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<link rel="preload" as="image" href="shell/camera-spin.jpg">
<style>html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }</style>
</head>
<body>
<div id="stage"></div>

<div id="title">
  <div id="collage" aria-hidden="true"></div>
  <div id="shade" aria-hidden="true"></div>
  <header id="titleText">
    <h1><span class="l1">The Art of the Mexican Revolution</span><span class="l2">Casasola’s Photography</span></h1>
    <button id="bPlay" type="button">Start Game</button>
  </header>
</div>

<div id="loader" aria-live="polite">
  <div class="tag">
    <p class="word" aria-label="Loading">L O A D I N G<span class="dots"><span> .</span><span> .</span><span> .</span></span></p>
    <div class="spin" aria-hidden="true"><div class="row"><div class="col"><img src="shell/camera-spin.jpg" alt="" draggable="false"></div></div></div>
  </div>
</div>
<script type="module" src="/src/shell/shell.js"></script>
</body>
</html>
